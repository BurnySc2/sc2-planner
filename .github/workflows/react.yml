name: RunTests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_frontend:
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['24', '25', '26']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}

    - name: Cache npm
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-${{ matrix.node }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Install dependencies
      run: |
        npm ci

    - name: Run format
      run: |
        npm run format

    - name: Run lint
      run: |
        npm run lint

    - name: Run typecheck
      run: |
        npm run typecheck

    # Node>=17 needs --openssl-legacy-provider (see package.json scripts); JamesIves v3 + playwright rebuild deferred; testAll uses --watchAll=false
    - name: Run tests
      run: |
        npm run testAll

  test_e2e:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Seems to hang on node 24 and 26 https://github.com/microsoft/playwright/issues/40724
        node: ['25']
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node ${{ matrix.node }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}

    - name: Cache npm
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-${{ matrix.node }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Install npm dependencies
      run: |
        npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install playwright dependencies
      run: |
        npx playwright install --with-deps chromium

    - name: Run e2e tests
      run: |
        npm run teste2e

  deploy_frontend:
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: ['26']
    runs-on: ${{ matrix.os }}
    needs: [test_frontend, test_e2e]
    if: github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node ${{ matrix.node }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node }}

    - name: Cache npm
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: ${{ runner.os }}-${{ matrix.node }}-node-production-${{ hashFiles('**/package-lock.json') }}

    - name: Install npm dependencies
      run: |
        npm ci

    - name: Build
      run: |
        npm run build

    - name: Publish to Github Pages
      if: github.ref == 'refs/heads/master'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: gh-pages           # The branch the action should deploy to.
        folder: build           # The folder the action should deploy.
